# Production deploy template. Lives on the server as /opt/portfolio-ai/docker-compose.yml.
#
# This file is a template on purpose: it names no hosts, no addresses and no
# credentials, because the repository is public. Everything specific lives in the
# .env beside it on the server, which is not in git and never will be.
#
# Deploying is one command -- `deploy-portfolio-ai`, see docs/DEPLOYMENT.md §9 --
# which does this, plus a backup, verification and cleanup:
#
#     docker compose pull
#     docker compose run --rm worker alembic upgrade head
#     docker compose up -d --remove-orphans
#
# Migrations as a separate one-shot rather than in an entrypoint, so the schema
# change is a step somebody takes and watches, not something that happens
# invisibly whenever a container restarts.

services:
  # The chat API. Nothing outside the Docker network can reach it: the only caller
  # is the portfolio's Express API, at http://portfolio-ai:8000, with the bearer
  # key attached server-side.
  api:
    image: ghcr.io/mmihaylov94/portfolio-ai:latest
    container_name: portfolio-ai
    command: python -m portfolio_ai.api
    env_file: .env
    networks: [traefik_proxy]
    restart: unless-stopped
    # How long Docker waits after asking the container to stop before killing it.
    # Its default of 10 s would cut off an answer mid-sentence on every deploy.
    # The API needs up to 40: 30 for open requests to finish, then 10 for answers
    # still being written for visitors who already left (api/main.py).
    stop_grace_period: 45s
    # Declared here rather than in the Dockerfile, because the worker runs the same
    # image and serves no HTTP. The image has no curl; Python it has. /healthz says
    # the process answers, and nothing more -- a database blip should not make
    # Docker report the API unhealthy. /readyz is for the deploy script.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      # No routing labels, deliberately: this service is not on the internet. And
      # this one, so that stays true whatever Traefik's defaults are -- with
      # exposedByDefault on, a container with no labels at all would get a route.
      # Publishing it and then guarding it with a bearer token would be two
      # defences where one is needed, and the exposed one would be the weaker.
      traefik.enable: "false"

  worker:
    image: ghcr.io/mmihaylov94/portfolio-ai:latest
    container_name: portfolio-ai-worker
    command: supercronic /etc/crontab
    env_file: .env
    environment:
      # Without this the container is on UTC and every time in the crontab is
      # wrong for half the year, in a way nothing reports.
      TZ: Europe/London
    networks: [traefik_proxy]
    restart: unless-stopped
    labels:
      # The same image, so the same EXPOSE 8000 -- and the same reason as above.
      traefik.enable: "false"
    # Both services run the same image and differ only in what they run. One
    # build, one tag, one thing to roll back.

networks:
  # Already exists on the server: the network Traefik and the portfolio's Express
  # API are on. Joining it is what lets the Express API reach this service by
  # name, and what lets this service reach Postgres by name without any port
  # being published to the host.
  traefik_proxy:
    external: true
