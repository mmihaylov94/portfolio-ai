# Production deploy template.
#
# This file is a template on purpose: it names no hosts, no addresses and no
# credentials, because the repository is public. Everything specific lives in the
# .env beside it on the server, which is not in git and never will be.
#
# Deploying is pulling and restarting:
#
#     docker compose -f compose.prod.yaml pull
#     docker compose -f compose.prod.yaml run --rm api alembic upgrade head
#     docker compose -f compose.prod.yaml up -d
#
# Migrations as a separate one-shot rather than in an entrypoint, so the schema
# change is a step somebody takes and watches, not something that happens
# invisibly whenever a container restarts.

networks:
  # Already exists on the server: the network Traefik and the portfolio's Express
  # API are on. Joining it is what lets the Express API reach this service by
  # name, and what lets this service reach Postgres by name without any port
  # being published to the host.
  traefik_proxy:
    external: true

services:
  api:
    image: ghcr.io/mmihaylov94/portfolio-ai:latest
    container_name: portfolio-ai
    command: uvicorn portfolio_ai.api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    networks: [traefik_proxy]
    restart: unless-stopped
    # No Traefik labels, deliberately. This service is not on the internet: the
    # only thing that talks to it is the Express API, from inside the network, at
    # http://portfolio-ai:8000. Publishing it and then guarding it with a bearer
    # token would be two defences where one is needed, and the weaker one would be
    # the one exposed.

  worker:
    image: ghcr.io/mmihaylov94/portfolio-ai:latest
    container_name: portfolio-ai-worker
    command: supercronic /etc/crontab
    env_file: .env
    environment:
      # Without this the container is on UTC and every time in the crontab is
      # wrong for half the year, in a way nothing reports.
      TZ: Europe/London
    networks: [traefik_proxy]
    restart: unless-stopped
    # Both services run the same image and differ only in what they run. One
    # build, one tag, one thing to roll back.
