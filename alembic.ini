; Alembic configuration.
;
; Deliberately almost empty. The database URL is not here -- it comes from
; Settings, via migrations/env.py, so there is exactly one place in the project
; that knows how to reach the database. Putting it here as well would mean two
; sources that can disagree, and the one in version control would be the wrong
; one.
;
; The logging sections Alembic's default template ships with are gone too. This
; project configures logging in portfolio_ai/logging.py, and having a second
; configuration in an ini file would fight it.

[alembic]
script_location = migrations

; Timestamped, readable filenames: 0001_knowledge_base.py rather than a bare
; hash. The revision identifier inside the file is what Alembic actually uses;
; this only affects what you see in the directory listing.
file_template = %%(rev)s_%%(slug)s
