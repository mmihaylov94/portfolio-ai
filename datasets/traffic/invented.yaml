# Invented conversations, for building the analytics without visitors.
#
# Nobody asked any of this. Every question here was written by hand so that the
# analytics commands have something to read on the development database:
#
#     uv run python -m portfolio_ai.analytics seed --dry-run    # the plan; spends nothing
#     uv run python -m portfolio_ai.analytics seed              # about $0.10
#     uv run python -m portfolio_ai.analytics seed --clear      # take it all out again
#
# `seed` runs each conversation through the real assistant, so the routes, scores,
# fallbacks and costs in the report are real ones. It refuses anything but
# ENVIRONMENT=local: in production an invented conversation would be
# indistinguishable from a visitor's.
#
# Each message says what it is meant to be:
#
#   kind: answerable   the knowledge base covers it
#   kind: gap          the knowledge base does not; `topic` groups those that belong
#                      in one content gap
#   kind: small_talk   a greeting, thanks, a question about the assistant itself
#   kind: off_topic    nothing to do with Mihail
#
#   rephrases_previous: true   the message before it, asked again in other words
#   rating / comment           a thumbs up (1) or down (-1) left on the answer
#
# The labels are intentions, not results. The assistant may route or answer a
# message differently, and that difference is what the thresholds are checked
# against (docs/ANALYTICS.md).
#
# This is not an eval dataset. It lives in a folder of its own so that nothing
# reading datasets/*.yaml takes it for one, and no run is ever scored against it.

description: >
  Twenty-eight invented conversations: recruiters, people with a project,
  developers curious about the assistant, and passers-by. Six topics the knowledge
  base does not cover, and eight questions asked twice in other words.

