# The second golden dataset: questions a visitor to mihaylov.io might ask, each with
# what a right answer looks like. Every reference answer comes from the knowledge
# base (knowledgebase/ in mmihaylov94/my-portfolio) as it stood on 2026-10-09, after
# the site's chat moved from n8n to this project and six articles were rewritten.
#
# Changed from golden_v1, because the articles they rest on changed:
#   python, followup-and-python   Python is in his stack now, through the assistant
#   ai-experience                 gains the evaluation harness
#   open-source                   gains the assistant's repository
#   assistant-how, n8n-work       the assistant is a Python service; n8n ran its first version
# New, on what the rewritten assistant article says:
#   assistant-built, assistant-n8n, python-projects, assistant-privacy,
#   assistant-models, assistant-source, assistant-quality, built-with-ai
# The other 48 cases are golden_v1's, unchanged.
#
# Frozen once a run of it completes. python -m portfolio_ai.evals refuses a changed
# file after that, because scores are only comparable on identical cases, so changes
# go into a copy named golden_v3.
#
# The contact cases check for Mihail's two published addresses exactly: the hiring one
# printed on his CV, and the one for projects and general inquiries. Both are public
# by his choice. No other email address belongs here, and a unit test fails if one
# appears.
#
# Fields, all but key, question and category optional:
#   key                a name for reports, lower-case-with-hyphens
#   question           what the visitor asks
#   category           the route the classifier should choose
#   also_accept        other routes that are right too
#   history            the conversation before the question, oldest first
#   expected_doc_ids   every document that answers it; finding any one is a hit
#   expect_fallback    the knowledge base cannot answer it, and saying so is right
#   reference_answer   what a good answer says; the judge scores completeness on it
#   must_include       case-insensitive text the answer has to contain
#   must_not_include   case-insensitive text the answer must not contain
#   notes              why the case exists, when that is not obvious

name: golden_v2
description: >-
  Sixty-two cases across the eleven knowledge-base articles: one- and multi-document
  questions, false premises, questions the knowledge base cannot answer, follow-ups
  that need the previous exchange, small talk, out-of-scope requests and adversarial
  prompts. golden_v1's fifty-four, six of them rewritten for the knowledge base after
  the cutover from n8n, and eight new ones about the assistant itself.

cases:
  # --- Who Mihail is ----------------------------------------------------------------

  - key: job-title
    question: "What is Mihail's job title?"
    category: mihail_related
    expected_doc_ids: [about-mihail, faq, hiring]
    reference_answer: >-
      He is a Solutions Architect, currently at Businessmap, and was previously a
      Technical Solution Architect at Deloitte LLP UK.
    must_include: ["Solutions Architect"]
    notes: >-
      The older labels, "Full-Stack Developer" among them, are retired (about-mihail.md).
      No rule forbids them: an answer may name one as retired. Calling him one is the
      judge's to catch.

  - key: businessmap-delivery
    question: "What has Mihail delivered at Businessmap?"
    category: mihail_related
    expected_doc_ids: [about-mihail, tech-stack]
    reference_answer: >-
      He led the migration of a PHP CodeIgniter monolith to a single sign-on portal,
      consolidating 60 tools and generalising client-specific builds into reusable
      products; the result is used by over 100 clients and became the basis for a 50%
      increase in his team's revenue. He built a custom MCP server with Claude Skills,
      behind an SSO-authenticated proxy that strips personal data, so business teams can
      query CRM and platform data conversationally. He also built a bi-directional CRM
      integration and a Partner Hub that cut quarterly commission processing from two
      weeks to two days.
    must_include: ["MCP"]
    notes: >-
      One project, as his CV describes it: the portal migration both consolidated the
      tools and turned client builds into reusable products. The AI work has to appear,
      hence "MCP", which every article uses: a short answer that leaves it out for the
      integrations fails on purpose. tech-stack counts because its AI section names the
      Businessmap MCP server.

  - key: team-leadership
    question: "Has Mihail ever managed a team?"
    category: mihail_related
    expected_doc_ids: [about-mihail, hiring]
    reference_answer: >-
      Yes. At Momenta Group Global he built and ran the support engineering function, a
      team that grew to fifteen people, and advanced two engineers to senior roles within
      six months. At Deloitte he led developers through implementation and testing.

  - key: education
    question: "Where did Mihail study?"
    category: mihail_related
    expected_doc_ids: [about-mihail, faq, hiring]
    reference_answer: >-
      At the University of Strathclyde in Glasgow: an MSc in Advanced Computer Science,
      awarded with Distinction, and before that a BEng (Hons) in Computer and Electronic
      Systems.
    must_include: ["Strathclyde"]

  - key: phd-false-premise
    question: "Where did Mihail do his PhD?"
    category: mihail_related
    expected_doc_ids: [about-mihail, faq]
    reference_answer: >-
      He doesn't have a PhD. His degrees are an MSc in Advanced Computer Science with
      Distinction and a BEng (Hons) in Computer and Electronic Systems, both from the
      University of Strathclyde.
    notes: A false premise. The answer has to correct it, not invent a PhD.

  - key: location
    question: "Where is Mihail based?"
    category: mihail_related
    expected_doc_ids: [about-mihail, contact, hiring]
    reference_answer: >-
      He is based in Sofia, Bulgaria.
    must_include: ["Sofia"]

  - key: languages
    question: "What languages does Mihail speak?"
    category: mihail_related
    expected_doc_ids: [about-mihail, contact, hiring]
    reference_answer: Bulgarian is his native language, and his English is fluent.
    must_include: ["Bulgarian", "English"]

  - key: certifications
    question: "Does Mihail have any certifications?"
    category: mihail_related
    expected_doc_ids: [about-mihail, faq, tech-stack]
    reference_answer: >-
      Yes, three: Certified Advanced RPA Developer and Certified RPA Associate, both from
      UiPath, and Certified Advanced RPA Professional A360 from Automation Anywhere.
    must_include: ["UiPath", "Automation Anywhere"]
    notes: >-
      The RPA Associate certification was added in the 2026-09-23 fact-check. An answer
      naming only two was probably written from a knowledge base indexed before then.

  # --- Getting in touch -------------------------------------------------------------

  - key: recruiter-contact
    question: "I'm a recruiter. How should I get in touch with Mihail?"
    category: mihail_related
    expected_doc_ids: [hiring, contact, faq, about-mihail, services]
    reference_answer: >-
      By email at m.mihaylov94@gmail.com, the hiring address printed on his CV, by phone on
