      service. Before that he wrote his MSc dissertation, a deep learning project, in
      Python, and used it for scripting in his RPA work at Deloitte.
    notes: >-
      Reversed at cutover: golden_v1 expected "not part of his current stack". An answer
      that still says so was written from an index older than 2026-10-08.

  - key: laravel
    question: "Does Mihail work with Laravel?"
    category: mihail_related
    expected_doc_ids: [tech-stack, about-mihail]
    reference_answer: >-
      Yes. PHP is part of his backend stack, with CodeIgniter and Laravel, alongside
      Node.js, Express and TypeScript.
    must_include: ["Laravel"]

  - key: ai-experience
    question: "What AI experience does Mihail have?"
    category: mihail_related
    expected_doc_ids:
      [tech-stack, about-mihail, services, faq, project-portfolio-ai-assistant, project-ai-marketing-reporter]
    reference_answer: >-
      He builds retrieval-augmented generation with vector search in PostgreSQL and
      pgvector, AI agents with tool calling, an evaluation harness that scores an
      assistant against a golden dataset with an LLM judge, and MCP servers with Claude
      Skills. Three examples run in production: the MCP server, Claude Skills and SSO-authenticated
      proxy at Businessmap, which let business teams query CRM and internal data without
      seeing personal data; the assistant on his own site; and the AI Marketing Reporter,
      an n8n pipeline that writes weekly marketing reports for a client.

  # --- The portfolio ----------------------------------------------------------------

  - key: portfolio-projects
    question: "What projects has Mihail built?"
    category: mihail_related
    expected_doc_ids:
      - faq
      - services
      - about-mihail
      - tech-stack
      - project-glotsmith
      - project-portfolio-ai-assistant
      - project-n8n-framework
      - project-ai-marketing-reporter
      - project-threadline
    reference_answer: >-
      Five are on his portfolio: Glotsmith, a commercial language-learning SaaS; the AI
      assistant on mihaylov.io; the n8n Pro Automation Framework; the AI Marketing
      Reporter; and Threadline, a moderated community forum.
    notes: >-
      No phrase rule: naming three and offering the rest is a good answer too, so how
      many it names is the judge's completeness. Nine articles give at least one project,
      so retrieval can hardly miss here; a miss would be the finding.

  - key: open-source
    question: "Which of Mihail's projects are open source?"
    category: mihail_related
    expected_doc_ids:
      - faq
      - project-threadline
      - project-n8n-framework
      - project-glotsmith
      - project-ai-marketing-reporter
      - project-portfolio-ai-assistant
    reference_answer: >-
      Threadline, the AI assistant on this site (portfolio-ai) and the lite edition of the
      n8n Pro Automation Framework (n8n-lite-automations) are public on his GitHub under
      the MIT licence, and so is the source of this website. The framework's pro edition is
      private, and Glotsmith is a commercial product whose source is private too.
    must_include: ["Threadline"]
    notes: >-
      Only the framework's lite edition is open. Calling the whole framework open source is
      the mistake faq.md made until the 2026-09-23 fact-check. The assistant's repository
      joined the list at cutover.

  - key: best-project
    question: "Which project best shows what Mihail can do?"
    category: mihail_related
    expected_doc_ids: [faq, project-glotsmith]
    reference_answer: >-
      Glotsmith, because he covered the whole span alone: product design, a demanding
      front end, a layered API, AWS infrastructure, CI/CD with rehearsed disaster
      recovery, subscription billing, and compliance implemented in code.
    must_include: ["Glotsmith"]

  - key: glotsmith-what
    question: "What is Glotsmith?"
    category: mihail_related
    expected_doc_ids: [project-glotsmith, faq]
    reference_answer: >-
      One place for a language course's materials and the tools to study them: learners
      upload the course's PDFs, scans, audio and video, then translate, listen, take notes
      and build one word list, organised into courses and workbooks. It doesn't teach; the
      course does. It is a commercial SaaS Mihail built and runs on his own, live since
      August 2026.
    must_include: ["language"]

  - key: glotsmith-not-a-chatbot
    question: "Is Glotsmith an AI chatbot?"
    category: mihail_related
    expected_doc_ids: [project-glotsmith]
    reference_answer: >-
      No. It uses cloud AI services, all from Google Cloud in production, for translation,
      text-to-speech, OCR and audio transcription, but it doesn't generate text and there
      is no chatbot in it.
    notes: >-
      A false premise, like phd-false-premise. Glotsmith uses AI services, so a visitor
      might assume a chatbot; the right answer says there isn't one.

  - key: glotsmith-paddle
    question: "Why did Glotsmith switch from Stripe to Paddle?"
    category: mihail_related
    expected_doc_ids: [project-glotsmith]
    reference_answer: >-
      For commercial and legal reasons, not technical ones. Restructuring from a limited
      company to working as a self-employed professional broke the Stripe setup, and
      Paddle, as Merchant of Record, takes on VAT, sales tax and invoicing, so the
      application needs no tax configuration at all.
    must_include: ["Merchant of Record"]

  - key: threadline-stack
    question: "What is Threadline built with?"
    category: mihail_related
    expected_doc_ids: [project-threadline, faq]
    reference_answer: >-
      CodeIgniter 4 and PHP with PostgreSQL, server-rendered pages with Bootstrap 5 and
      plain JavaScript, Quill for rich text, Google sign-in and reCAPTCHA v3, running in
      Docker on AWS EC2 behind Cloudflare and Traefik.
    must_include: ["CodeIgniter"]

  - key: threadline-moderation
    question: "How does moderation work in Threadline?"
    category: mihail_related
    expected_doc_ids: [project-threadline]
    reference_answer: >-
      Reports carry guideline reasons and go into a queue where moderators resolve or
      dismiss them with notes. Moderator edits are recorded in the audit log, which also
      records moderation and administrative actions, and role management stops an
      administrator from removing their own access.
    must_not_include: ["escalat"]
    notes: >-
      There is no escalate action. The article described one until the 2026-09-23
      fact-check found the code does not support it, along with moderator edits marked
      apart from author edits.

  - key: n8n-framework
    question: "What is the n8n Pro Automation Framework?"
    category: mihail_related
    expected_doc_ids: [project-n8n-framework, faq, services]
    reference_answer: >-
      A productised framework for n8n automation: reusable sub-workflows with documented
      interface contracts, idempotency, run logging for observability, and configuration
      kept outside the workflows, with the processed events, run logs, sync state and
      variables held in n8n Data Tables. Five workflows are built on it. A smaller lite
      edition is public on GitHub, and the full pro edition is private.
    must_not_include: ["PostgreSQL"]
    notes: Its tables are n8n Data Tables, which the article called PostgreSQL until 2026-09-23.

  - key: marketing-reporter
    question: "What does the AI Marketing Reporter do?"
    category: mihail_related
    expected_doc_ids: [project-ai-marketing-reporter, about-mihail, faq, services, tech-stack]
    reference_answer: >-
      It is a weekly n8n pipeline, in production for a client. For each client in a list
      it pulls Meta Ads, Google Ads and Google Analytics data and normalises it, a language
      model writes the performance analysis and recommendations, and the report is emailed
      and recorded in Google Sheets.

  - key: assistant-how
    question: "How does this chat assistant work?"
    category: mihail_related
    expected_doc_ids: [project-portfolio-ai-assistant, about-mihail, faq, services, tech-stack]
    reference_answer: >-
      It is retrieval-augmented: it answers from a curated Markdown knowledge base, not
      from a model's training data. Each message is first classified as a question about
      Mihail's work, small talk or off-topic. For a question about his work the model has
      to search before it answers, writing its own queries for up to three rounds, and each
      query is embedded and matched against the knowledge base in PostgreSQL with pgvector.
      The answer is streamed as it is written, with the articles it drew on listed under
      it.
    notes: >-
      Rewritten for the Python system. golden_v1's reference described the n8n one, which
      the article did until the cutover.

  - key: postgres-projects
    question: "Which of Mihail's projects use PostgreSQL?"
    category: mihail_related
    expected_doc_ids:
      - project-glotsmith
      - project-threadline
      - project-portfolio-ai-assistant
      - faq
      - about-mihail
      - tech-stack
    reference_answer: >-
      Glotsmith (PostgreSQL on Amazon RDS), Threadline, and the AI assistant on this site
      (PostgreSQL with pgvector).
    notes: >-
      Each project's own article names its database, and faq.md, about-mihail.md and
      tech-stack.md name one or two of them; recall shows how many retrieval found. The n8n
      Pro Automation Framework is not one of them: its tables are n8n Data Tables, which
      its article called PostgreSQL until the 2026-09-23 fact-check.

  - key: n8n-work
    question: "What has Mihail built with n8n?"
    category: mihail_related
    expected_doc_ids:
      - project-n8n-framework
      - project-ai-marketing-reporter
      - project-portfolio-ai-assistant
      - about-mihail
      - faq
      - tech-stack
    reference_answer: >-
      The n8n Pro Automation Framework, the AI Marketing Reporter (in production for a
      client), and business process automation at Businessmap across finance, HR and
      operations. The first version of the AI assistant on this site also ran on n8n,
      before he rebuilt it in Python in 2026.
    notes: >-
      about-mihail.md is the only article with the Businessmap automation; faq.md and
      tech-stack.md name the framework and the reporter. The assistant stopped running on
      n8n at cutover. Leaving its first version out makes an answer less complete, and
      presenting it as an n8n project today makes it wrong; both are the judge's to read.

  # --- The assistant itself ---------------------------------------------------------
  # New in golden_v2, on what the rewritten assistant article says.

  - key: assistant-built
    question: "How was this assistant built?"
    category: mihail_related
    expected_doc_ids: [project-portfolio-ai-assistant, about-mihail, faq, services, tech-stack]
    reference_answer: >-
      Twice. The first version ran on a self-hosted n8n instance, using n8n's AI agent
      node with tool calling. In 2026 Mihail rebuilt it as a Python service, to add
      streamed answers, an evaluation harness, thumbs up and down on answers and a record
      of what each answer costs. He built the Python version with Claude Code as a pair
      programmer, reviewing every change himself.
    notes: >-
      Asked before cutover, this got a long answer under a "Key details:" lead-in, so it
      measures length and style as well as the history.

  - key: assistant-n8n
    question: "Is this chat built with n8n?"
    category: mihail_related
    expected_doc_ids: [project-portfolio-ai-assistant, about-mihail, faq, services, tech-stack]
    reference_answer: >-
      Not any more. Its first version ran on a self-hosted n8n instance, and in 2026
      Mihail rebuilt it as a Python service with FastAPI.
    notes: >-
      A premise that was true until the cutover on 2026-10-09. n8n is all over the
      knowledge base, so a plain yes is the easy mistake.

  - key: python-projects
    question: "Which of Mihail's projects are built in Python?"
    category: mihail_related
    expected_doc_ids: [tech-stack, project-portfolio-ai-assistant, about-mihail, faq, services]
    reference_answer: >-
      One: the AI assistant on this site, an asynchronous FastAPI service he built in
      2026. None of his other portfolio projects use Python.
    notes: >-
      tech-stack.md says not to attribute any other portfolio project to Python. Naming
      Glotsmith or Threadline here is the mistake, and the judge's to catch.

  - key: assistant-privacy
    question: "What happens to the messages I type here?"
    category: mihail_related
    expected_doc_ids: [project-portfolio-ai-assistant]
    reference_answer: >-
      Conversations are stored for 90 days, so that Mihail can see what visitors ask and
      where the assistant fails them, and are then deleted. Each message is sent to
      OpenAI's API to be answered, with the storing of responses on OpenAI's side switched
      off. An IP address is kept only as a keyed hash, the chat sets no cookies, and the
      conversation is also kept in the visitor's own browser for 24 hours after its last
      message, so that a reload does not lose it.
    must_include: ["90 days"]
    notes: >-
      Asked before cutover, the answer pointed to a privacy section the site does not
      have. No rule forbids the phrase: an invented pointer is unfaithful, which the judge
      scores.

  - key: assistant-models
    question: "Which AI model does this assistant use?"
    category: mihail_related
    expected_doc_ids: [project-portfolio-ai-assistant]
    reference_answer: >-
      OpenAI's gpt-5-mini writes the answers, and text-embedding-3-small produces the
      embeddings its search runs on.
    must_include: ["gpt-5-mini"]
    notes: >-
      The model names are in one line of one article. A change of model changes that line,
      and this case with it, in a new dataset version.

  - key: assistant-source
    question: "Can I see the code behind this assistant?"
    category: mihail_related
    expected_doc_ids: [project-portfolio-ai-assistant, faq]
    reference_answer: >-
      Yes. Its source is public under the MIT licence at
      https://github.com/mmihaylov94/portfolio-ai, including its prompts, its evaluation
      dataset and results, and its design notes.
    must_include: ["github.com/mmihaylov94/portfolio-ai"]
    notes: >-
      The address has to arrive whole. It is a real page, so the link filter must leave it
      alone.

  - key: assistant-quality
    question: "How does Mihail know the assistant's answers are any good?"
    category: mihail_related
    expected_doc_ids: [project-portfolio-ai-assistant, tech-stack]
    reference_answer: >-
      An evaluation harness scores it against a golden dataset of questions written from
      the knowledge base. For each one it checks that the right articles were retrieved
      and that the answer follows the rules, and a separate judge model, gpt-5, grades the
      answer for completeness and for faithfulness to the passages it was given. Those
      runs chose the production setting: minimal reasoning effort brought the median wait
      for the first word from 15.6 seconds to 3.9.
    notes: >-
      The article gives the dataset's size as 54, which is golden_v1's. The reference
      leaves the number out, so an answer that repeats it is neither helped nor hurt.
      about-mihail.md and services.md name the harness in passing, which is not enough to
      list them.

  - key: built-with-ai
    question: "Did Mihail use AI to write this assistant's code?"
    category: mihail_related
    expected_doc_ids: [project-portfolio-ai-assistant, tech-stack]
    reference_answer: >-
      Yes. He built the Python version with Claude Code as a pair programmer, reviewing
      every change himself, and its repository includes a lesson series on the Python
      behind it.
    must_include: ["Claude Code"]
    notes: >-
      A recruiter's question, and the knowledge base answers it plainly. Playing it down,
      or saying the knowledge base does not say, fails.

  # --- Not in the knowledge base ----------------------------------------------------
  # The right answer is to say so. rag_agent.md forbids guessing pay, pricing and
  # personal details.

  - key: salary
    question: "What salary is Mihail expecting?"
    category: mihail_related
    expect_fallback: true

  - key: hourly-rate
    question: "How much does Mihail charge per hour for freelance work?"
    category: mihail_related
