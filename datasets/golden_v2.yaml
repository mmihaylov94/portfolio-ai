  - key: project-inquiry
    question: "I have a project I'd like Mihail's help with. How do I reach him?"
    category: mihail_related
    expected_doc_ids: [contact, services, faq, about-mihail, hiring]
    reference_answer: >-
      Email mihaylov.dev@gmail.com, his address for projects and general inquiries, or use
      the contact form on mihaylov.io and pick "project inquiry" as the reason.
    must_include: ["mihaylov.dev@gmail.com"]
    notes: The opposite of recruiter-contact. The projects address, not the CV's.

  - key: cv-download
    question: "Can I download Mihail's CV?"
    category: mihail_related
    expected_doc_ids: [contact, faq]
    reference_answer: >-
      Yes. It's linked from the top of mihaylov.io and from the contact section, at
      https://mihaylov.io/Mihail_Mihaylov_CV.pdf.
    must_include: ["Mihail_Mihaylov_CV.pdf"]

  # --- Services and hiring ----------------------------------------------------------

  - key: freelance
    question: "Does Mihail take on freelance or consulting work?"
    category: mihail_related
    expected_doc_ids: [services, hiring]
    reference_answer: >-
      Yes. Alongside his employment he takes on consulting and freelance work in production
      AI systems, solution architecture, automation, API-led integrations and enterprise
      RPA.
    notes: >-
      Production AI leads, as services.md now orders it. No phrase rule can check the
      order; an answer that buries AI at the end is the judge's to mark down.

  - key: compliance-services
    question: "Can Mihail help with GDPR compliance?"
    category: mihail_related
    expected_doc_ids: [services, project-glotsmith]
    reference_answer: >-
      On the implementation side, yes. He isn't a lawyer and doesn't give legal advice,
      but he builds GDPR obligations into code and database schema, with retention sweeps,
      consent records and data export, and can offer practical guidance from doing this
      for Glotsmith. What the law requires of a business stays with its legal advisers.
    notes: >-
      Answered from two documents. An answer presenting him as a source of legal advice
      fails; that is the judge's to catch, since no phrase rule can tell "not legal
      advice" from "legal advice".

  - key: roles-wanted
    question: "What kind of roles is Mihail looking for?"
    category: mihail_related
    expected_doc_ids: [hiring]
    reference_answer: >-
      Solutions Architect, Solutions Engineer, AI Engineer, Forward Deployed Engineer and
      Automation Engineer roles, and agentic automation positions, ideally work that
      combines process understanding, automation architecture, API integration and
      hands-on engineering.
    must_include: ["architect"]
    must_not_include: ["RPA Developer", "intelligent automation"]
    notes: >-
      "architect" rather than "Solutions Architect", so "solution architect roles" passes.
      Both retired labels were dropped on 2026-09-25; an answer naming one was written
      from an index older than that. The rule names the labels, not "RPA": his RPA
      background is still in the knowledge base and may fairly appear as context.

  - key: hire-from-germany
    question: "We're a German company. Can we hire Mihail?"
    category: mihail_related
    expected_doc_ids: [hiring, about-mihail, contact]
    reference_answer: >-
      Yes, and it's straightforward: he works remotely from Bulgaria, which adopted the
      euro in January 2026, so a German employer carries no currency risk, and Employer
      of Record providers such as Deel, Remote and G-P offer employment there. He can
      also work as an independent contractor and invoice directly.

  # --- Skills -----------------------------------------------------------------------

  - key: python
    question: "Does Mihail know Python?"
    category: mihail_related
    expected_doc_ids: [tech-stack, about-mihail, project-portfolio-ai-assistant]
    reference_answer: >-
      Yes. He built the AI assistant on this site in Python in 2026, with Claude Code as a
