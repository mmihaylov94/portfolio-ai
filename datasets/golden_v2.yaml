  # --- Follow-ups -------------------------------------------------------------------
  # Each needs the previous exchange to be understood. n8n classified the message
  # alone, which sent "yes please" to small talk, the one route that cannot search.

  - key: followup-yes-please
    history:
      - role: user
        content: "What is Glotsmith?"
      - role: assistant
        content: >-
          Glotsmith keeps a language course's materials in one place, from PDFs and scans
          to audio and video, with tools to translate, listen, take notes and build a word
          list. Mihail designed, built and runs it on his own. Would you like to hear how
          it's built?
    question: "yes please"
    category: mihail_related
    expected_doc_ids: [project-glotsmith]
    reference_answer: >-
      It is a Vue 3 single-page app and a Node.js and Express API, both in TypeScript, over
      PostgreSQL, running in Docker on AWS EC2 behind Cloudflare, with RDS for the
      database, S3 for files and Paddle for billing.

  - key: followup-and-python
    history:
      - role: user
        content: "Does Mihail work with Laravel?"
      - role: assistant
        content: >-
          Yes. PHP is part of his backend stack, with CodeIgniter and Laravel, alongside
          Node.js and TypeScript. Want to hear more about his backend work?
    question: "And Python?"
    category: mihail_related
    expected_doc_ids: [tech-stack, about-mihail, project-portfolio-ai-assistant]
    reference_answer: >-
      Yes. He built the AI assistant on this site in Python in 2026, his first production
      Python service, and before that used Python for his MSc dissertation and for
      scripting in his RPA work at Deloitte.

  - key: followup-sure
    history:
      - role: user
        content: "What is Threadline?"
      - role: assistant
        content: >-
          Threadline is a moderated community forum Mihail built with CodeIgniter 4 and
          PostgreSQL, with role-based moderation and audit trails. Would you like to know
          how its moderation works?
    question: "sure"
    category: mihail_related
    expected_doc_ids: [project-threadline]
    reference_answer: >-
      Reports carry guideline reasons and go into a queue where moderators resolve or
      dismiss them with notes, moderator edits are recorded in the audit log, and the audit
      log also records moderation and administrative actions.
    must_not_include: ["escalat"]

  - key: followup-thanks
    history:
      - role: user
        content: "Where is Mihail based?"
      - role: assistant
        content: >-
          Mihail is based in Sofia, Bulgaria, and works remotely across European and
          US-overlap hours.
    question: "Great, thanks!"
    category: small_talk
    notes: A follow-up that is small talk, so context must not send everything to search.

