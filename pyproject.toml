[project]
name = "portfolio-ai"
version = "0.1.0"
description = "RAG assistant, ingestion pipeline and eval harness for the mihaylov.io knowledge base"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]

dependencies = [
    # LLM + embeddings
    "openai>=1.60",
    # Postgres: the driver, its async connection pool, and pgvector type adapters
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    # Typed models and env-driven settings
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    # Structured JSON logging
    "structlog>=24.4",
    # HTTP API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    # Outbound HTTP (GitHub API)
    "httpx>=0.28",
    # Schema migrations
    "alembic>=1.14",
    # Command-line entrypoints
    "typer>=0.15",
    # Eval dataset files
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "types-pyyaml>=6.0",
]

[project.scripts]
# Installed onto PATH, which is what lets another repository run the checker
# without knowing anything about this one's layout:
#   docker run --rm -v ./knowledgebase:/kb ghcr.io/mmihaylov94/portfolio-ai \
#       portfolio-ai-validate /kb
portfolio-ai-validate = "portfolio_ai.ingestion.validate:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_ai"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Lesson files contain Python snippets, and some of them are deliberately wrong --
# the blocking call in lesson 5, the f-string SQL in lesson 6. Formatting them
# would quietly rewrite the examples the lessons are teaching from.
extend-exclude = ["docs"]

[tool.ruff.lint]
# Preview rules are opted into deliberately, for RUF029 and part of ASYNC. They can
# change between ruff releases, which is survivable because uv.lock pins the version:
# an upgrade is a commit somebody reviews, not something that happens on a Tuesday.
preview = true

# Chosen group by group rather than `select = ["ALL"]`. With ALL the ignore list
# becomes the real configuration, and it grows silently every time ruff ships a rule
# -- so CI can break with no change to the code. Everything here earns its line.
select = [
    "E", "W",   # pycodestyle -- whitespace and the things format does not fix
    "F",        # pyflakes -- undefined names, unused imports, f-strings with no fields
    "I",        # import sorting, so import blocks stop showing up in diffs
    "N",        # pep8-naming
    "UP",       # pyupgrade -- keeps syntax at the 3.12 floor we declared
    "B",        # bugbear -- mutable default arguments and friends
    "A",        # shadowing builtins: a local named `id` or `type` reads fine and is not
    "C4",       # comprehensions
    "SIM",      # simplifications that genuinely read better
    "RET",      # return-statement shape
    "PTH",      # pathlib over os.path
    "TC",       # imports needed only for annotations belong in a TYPE_CHECKING block
    "S",        # bandit: SQL built by concatenation, hardcoded passwords, weak hashes.
                # The project rule "never f-string a value into SQL" is S608, enforced.
    "ASYNC",    # blocking calls inside async functions -- the lesson 5 trap
    "LOG", "G", # logging antipatterns: %-formatting, .format(), f-strings in log calls
    "DTZ",      # naive datetimes. Retention and scheduling both depend on tz-aware ones
    "T20",      # print(). Output goes through structlog so it is parseable in production
    "ARG",      # arguments a function never uses
    "PT",       # pytest style
    "PL",       # the useful pylint subset
    "TRY",      # exception antipatterns
    "RUF",      # ruff's own, including RUF029 (an async def that never awaits)
]

ignore = [
    # These three are one opinion in three rules: that a raise must never contain its
    # own message, so every message needs either a variable or a bespoke exception
    # class. `raise ConfigError(_describe(exc))` is exactly what we want it to say.
    "raise-vanilla-args",
    "raw-string-in-exception",
    "f-string-in-exception",

    # Wants log.exception (which attaches a traceback) in every except block. cli.py
    # suppresses the traceback on purpose for errors we raised ourselves: the message
    # is already written for a human, and the stack adds noise rather than information.
    "error-instead-of-exception",

    # Flags comments that look like commented-out code. This repository is a teaching
    # one and is heavily commented, including with SQL fragments and shell lines, which
    # is precisely the shape the heuristic misreads.
    "commented-out-code",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "assert",     # assert is how a test states its claim
    "magic-value-comparison",  # the magic value in an assertion is the expected value
    "import-private-name",  # tests import _private helpers on purpose -- that is the unit
]

[tool.ruff.lint.isort]
known-first-party = ["portfolio_ai"]

[tool.mypy]
python_version = "3.12"

# Everything, not just src. Eleven of the fifteen errors this first found were in
# tests, and test code is where an unchecked annotation does the most damage: a test
# that cannot fail still passes.
files = ["src", "tests", "migrations"]

# strict is a bundle of about a dozen flags, and nearly all of them mean "you did not
# write anything down here". Turning it on found almost nothing in src, which is the
# useful result -- the annotations were already complete.
strict = true

# Without this, mypy reads Settings() as a class with two required arguments, because
# nothing in the signature says pydantic-settings fills them from the environment. The
# plugin knows, and also teaches mypy about _env_file.
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# Puts tests/ itself on the import path, so both suites can share helpers that are
# not tests -- tests/openai_fake.py, the stand-in for the OpenAI API. Without it a
# test in tests/unit can import only what sits in tests/unit.
pythonpath = ["tests"]

# Integration tests need a reachable Postgres, so they are opt-in. A default
# suite that fails when you are on a train is a suite people stop running.
#   uv run pytest                  unit only
#   uv run pytest -m integration   the rest
addopts = "-m 'not integration'"
markers = [
    "integration: needs a real Postgres. Creates and drops a throwaway schema.",
]

# Treat every async test as an asyncio test without needing a decorator on each
# one. The alternative is @pytest.mark.asyncio on everything, and forgetting it
# does not fail -- pytest builds the coroutine, never awaits it, and reports a
# pass. That is the lesson 5 trap wearing a different hat.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
